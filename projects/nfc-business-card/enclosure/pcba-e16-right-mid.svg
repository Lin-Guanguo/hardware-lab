<text x="1010" y="108" font-size="15" font-weight="bold">当前方案要点</text>
<text x="1010" y="130" class="s">USB：右边缘中部，插口朝 +x，缺口 9.24 × 6.5 mm</text>
<text x="1010" y="151" class="s">J1 包络外缘 x=88.4（板外 4.45 mm），信号焊盘 x≈75.95</text>
<text x="1010" y="172" class="s">U1 (65.0, 8.0) 转 180°，天线朝下板边</text>
<text x="1010" y="193" class="s">板框：84 × 52 的 L 形，左下 33.5 × 15 mm 电池挖空</text>
<text x="1010" y="214" class="s">挖空对 30 × 12 电芯留 3.5 × 3 mm 余量</text>
<text x="1010" y="235" class="s">NFC 保留区 x 60–82 / y 24–50，双面零铜</text>
<text x="1010" y="268" font-size="15" font-weight="bold">按键</text>
<text x="1010" y="290" class="s">两颗 KEY-SMD_4P：SW1 y=3.30、SW3 y=15.10</text>
<text x="1010" y="311" class="s">中心距 11.80 mm，本体间隙 6.60 mm</text>
<text x="1010" y="332" class="s">键列 x=38.1，落在屏幕包络 y≥18.3 之下</text>
<text x="1010" y="353" class="s">外壳开孔与键列同 x，孔径沿用原设计</text>
<text x="1010" y="386" font-size="15" font-weight="bold">参考数据</text>
<text x="1010" y="408" class="s">55 个位号（SW2 于 2026-09-23 删除）</text>
<text x="1010" y="429" class="s">778 段铜线 · 162 个过孔 · 两层 GND 覆铜</text>
<text x="1010" y="450" class="s">原生 DRC：普通间距 0、连接 0</text>
<text x="1010" y="471" class="s">仅 12 项既有 J1 沉板槽边告警（7.9 mil）</text>
