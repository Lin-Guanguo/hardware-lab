<text x="930" y="474" class="small">2. 屏幕/FPC 区需和外壳窗口同步</text>
<text x="930" y="496" class="small">3. USB 开口、板边和器件净距需重画</text>
<text x="930" y="518" class="small">4. 走线完成前不能生成制造稿</text>
