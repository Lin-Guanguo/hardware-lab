<text x="755" y="157" font-size="19" font-weight="bold">这版增加了什么</text>
<text x="755" y="191" font-size="15">实线：器件简化包络 / 电池目标</text>
<text x="755" y="218" font-size="15">虚线：路径、净空、操作与电路预留</text>
<text x="755" y="260" font-size="16" font-weight="bold">J1 · 沉板 USB-C</text>
<text x="755" y="286" font-size="14">USB4500；USB 2.0 数据 + 充电</text>
<text x="755" y="310" font-size="14">主体高 3.16 mm；板边开槽待 DFM</text>
<text x="755" y="352" font-size="16" font-weight="bold">J2 · 屏幕 FPC 座</text>
<text x="755" y="378" font-size="14">FH12；底接触，方向仍须核对</text>
<text x="755" y="402" font-size="14">紫色区表示路径，不是已折好的排线</text>
<text x="755" y="444" font-size="16" font-weight="bold">需要继续解决</text>
<text x="755" y="470" font-size="14">主控供货 / 屏幕新版规格 / 电池包体</text>
<text x="755" y="494" font-size="14">NFC 铜净空与匹配 / 键帽与固定结构</text>
<text x="755" y="536" font-size="14" class="muted">几何检查只覆盖简化实体。</text>
<text x="44" y="618" font-size="20" font-weight="bold">厚度比较：USB 区是目前更紧的局部叠层</text>
<text x="44" y="648" font-size="14" class="muted">规划值加入壁厚、连接器高度及间隙分配；不是供应商保证上界，也不是整机厚度测量。</text>
