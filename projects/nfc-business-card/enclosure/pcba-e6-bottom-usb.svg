<text x="318" y="594" font-size="14">USB 插入方向</text>
<text x="755" y="191" font-size="14">实线：器件包络；虚线：设计预留</text>
<text x="755" y="218" font-size="14">独立 EDA 预布局，旧版试布线保留</text>
<text x="755" y="260" font-size="14">USB 从下长边插入</text>
<text x="755" y="286" font-size="14">槽后方为连续板材，靠近主控/充电器</text>
<text x="755" y="310" font-size="14">取消原来电池右侧的 2.2 mm 窄支臂</text>
<text x="755" y="352" font-size="14">电池横放，靠右但留间隙</text>
<text x="755" y="378" font-size="14">距假设右壁/底壁各 1.2 mm</text>
<text x="755" y="402" font-size="14">厚度、公差与引线仍待样品确认</text>
<text x="755" y="444" font-size="14">三个按键移到电池左侧竖排</text>
<text x="755" y="470" font-size="14">屏幕 / FPC / NFC 大位置保留</text>
<text x="755" y="494" font-size="14">先核真实焊盘，再重新布 USB 和控制线</text>
<text x="755" y="157" font-size="19" font-weight="bold">这版增加了什么</text>
<text x="755" y="536" font-size="14" class="muted">几何检查只覆盖简化实体。</text>
