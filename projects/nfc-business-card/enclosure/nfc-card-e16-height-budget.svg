<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
<rect width="1000" height="640" fill="#F7F9FC"/>
<style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#172B41}.s{font-size:13px}.m{fill:#52657B}.xs{font-size:11px}</style>
<text x="36" y="34" font-size="23" font-weight="bold">E16 · 5 mm 高度预算剖面（电池区切片 x 0–40 mm，纵向放大）</text>
<text x="36" y="56" class="s m">GCT USB4500-03-0-A 要求 0.80 mm 板厚，PCB 不能减薄；壳壁 0.8+0.8 后留给元件的净高只有 2.6 mm</text>
<rect x="120.0" y="219.6" width="480.0" height="9.6" fill="#8FA9C1" stroke="#31506E" stroke-width="1.6"/>
<text x="360.0" y="238.8" text-anchor="middle" class="xs">下壳 0.8</text>
<rect x="120.0" y="155.0" width="480.0" height="9.6" fill="#9BB8AA" stroke="#2F6B57" stroke-width="1.6"/>
<text x="360.0" y="174.2" text-anchor="middle" class="xs">PCB 0.8（连接器硬要求）</text>
<rect x="120.0" y="60.0" width="480.0" height="9.6" fill="#B9C9DC" stroke="#31506E" stroke-width="1.6"/>
<text x="360.0" y="79.2" text-anchor="middle" class="xs">上壳 0.8</text>
<rect x="156.0" y="82.8" width="360.0" height="36.0" fill="#E6B96E" stroke="#8A5A12" stroke-width="1.6"/>
<text x="336.0" y="143.8" text-anchor="middle" class="xs">电池 3.0 标称</text>
<rect x="156.0" y="82.8" width="360.0" height="2.4" fill="#D14343" fill-opacity="0.55" stroke="#8B1E1E" stroke-width="1.4"/>
<text x="336.0" y="90.6" text-anchor="middle" class="xs" fill="#7A1010">顶上壳 0.2 mm（54 mm³）</text>
<rect x="144.0" y="122.7" width="448.8" height="10.2" fill="#C5D5E5" stroke="#31506E" stroke-width="1.6"/>
<text x="368.4" y="142.9" text-anchor="middle" class="xs">屏幕玻璃 0.85</text>
<text x="108.0" y="64.0" text-anchor="end" class="xs m">5.0</text>
<text x="614.0" y="155.2" class="xs m">元件净高 2.6</text>
<line x1="606.0" y1="155.0" x2="606.0" y2="90.4" stroke="#94A3B8" stroke-width="1.2"/>
<text x="120" y="300" font-size="15" font-weight="bold">结论</text>
<text x="860" y="324" class="s">三条出路（需按实测电池包络选择）</text>
<text x="860" y="344" class="xs m">a) 换 ≤2.6 mm 薄电池：5.0 mm 目标成立</text>
<text x="860" y="364" class="xs m">b) 整机放宽到约 5.4 mm：可直接用 3 mm 电池</text>
<text x="860" y="384" class="xs m">c) 电池区局部沉台/开窗：牺牲局部强度与密封</text>
<text x="860" y="404" class="xs m"></text>
<text x="860" y="424" class="xs m">本图只画高度关系；平面开口见 pcba-e16-right-mid.svg</text>
</svg>
